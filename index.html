<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعدي الصوتي</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--accent:#4f46e5;--me:#e0e7ff;--bot:#f1f5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--text:#eef0f6;--muted:#9aa3b2;--accent:#818cf8;--me:#2b2f55;--bot:#222634}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--text:#eef0f6;--muted:#9aa3b2;--accent:#818cf8;--me:#2b2f55;--bot:#222634}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px;font-weight:700;font-size:18px;text-align:center}
#log{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.6;font-size:16px;word-wrap:break-word}
.me{background:var(--me);align-self:flex-start}
.bot{background:var(--bot);align-self:flex-end}
.b a{color:var(--accent);font-weight:700}
#tips{padding:6px 14px;color:var(--muted);font-size:13px;text-align:center}
.bar{display:flex;gap:8px;padding:10px 14px;align-items:center}
input{flex:1;padding:12px 14px;border-radius:24px;border:1px solid var(--muted);background:var(--card);color:var(--text);font-size:16px;min-width:0}
button{border:0;cursor:pointer;font-family:inherit}
#mic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;flex:none}
#mic.on{animation:p 1s infinite;background:#dc2626}
@keyframes p{50%{transform:scale(1.12)}}
#send{background:var(--card);color:var(--text);border:1px solid var(--muted);border-radius:24px;padding:12px 16px;font-size:16px}
</style>
</head>
<body>
<header>🎙️ مساعدي الصوتي</header>
<div id="log"></div>
<div id="tips">جرب: «الساعة كام» • «افتح يوتيوب» • «دور على طريقة كشري» • «مؤقت 5 دقايق» • «احسب 12 × 3» • «قولي نكتة»</div>
<div class="bar">
  <input id="txt" placeholder="أو اكتب الأمر هنا…" autocomplete="off">
  <button id="send">ابعت</button>
  <button id="mic" aria-label="تكلم">🎤</button>
</div>
<script>
const $=id=>document.getElementById(id),log=$('log');
function add(t,who,link){
  const d=document.createElement('div');d.className='b '+who;d.textContent=t;
  if(link){d.appendChild(document.createElement('br'));const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener';a.textContent='اضغط هنا للفتح ↗';d.appendChild(a)}
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';speechSynthesis.speak(u)}catch(e){}
}
function reply(t,link){add(t,'bot',link);speak(t);if(link){try{window.open(link,'_blank')}catch(e){}}}
function norm(s){
  return s.toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/[؟?!.,،]/g,' ').replace(/\s+/g,' ').trim();
}
const sites={يوتيوب:'https://www.youtube.com',جوجل:'https://www.google.com',واتساب:'https://web.whatsapp.com',فيسبوك:'https://www.facebook.com',خرائط:'https://maps.google.com',ماب:'https://maps.google.com',تيليجرام:'https://web.telegram.org',انستجرام:'https://www.instagram.com',تويتر:'https://x.com',جيميل:'https://mail.google.com',نتفليكس:'https://www.netflix.com'};
const jokes=['مرة واحد غبي اشترى ساعة منبه، قاله البياع دي بترن الساعة 7، قاله طب وأنا هصحى منين؟','واحد قال لصاحبه: أنا بحب الشتا. قاله ليه؟ قاله عشان أول ما بقول برد، بلاقي حد يقولي البس.','مرة تلميذ قال للمدرس: أنا مش بغش. المدرس: أمال بتعمل إيه؟ قاله: بتبادل معلومات.'];
let timer=null;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),900)}catch(e){}}
function handle(raw){
  const t=norm(raw);
  if(!t)return;
  add(raw,'me');
  const now=new Date();
  if(/(الساعه|الوقت)/.test(t)&&!/مؤقت|منبه/.test(t))return reply('الساعة دلوقتي '+now.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'}));
  if(/(التاريخ|النهارده|اليوم|انهي يوم)/.test(t))return reply('النهارده '+now.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  let m=t.match(/(?:مؤقت|منبه|فكرني بعد)\s*(\d+)\s*(دقيق|دقايق|ثانيه|ثواني|ساعه|ساعات)/);
  if(m){
    const n=+m[1],u=m[2];const ms=n*(/دقيق|دقايق/.test(u)?60000:/ساع/.test(u)?3600000:1000);
    clearTimeout(timer);timer=setTimeout(()=>{beep();reply('⏰ المؤقت خلص!')},ms);
    return reply('تمام، هنبهك بعد '+n+' '+u+'. سيب الصفحة مفتوحة.');
  }
  m=t.match(/(?:احسب|حساب)\s*(.+)/);
  if(m){
    const e=m[1].replace(/[×x*]|ضرب/g,'*').replace(/÷|قسمه|علي/g,'/').replace(/زائد|زايد|و/g,'+').replace(/ناقص|ينقص/g,'-');
    if(/^[\d+\-*/.() ]+$/.test(e)){try{const r=Function('"use strict";return ('+e+')')();return reply('الناتج: '+(Math.round(r*1e6)/1e6))}catch(x){}}
    return reply('معرفتش أحسب ده، جرب مثلا: احسب 12 × 3');
  }
  m=t.match(/(?:كلم|اتصل ب|اتصل)\s*([\d\s+]{6,})/);
  if(m){const n=m[1].replace(/\s/g,'');return reply('بتصل بالرقم '+n,'tel:'+n)}
  m=t.match(/(?:شغل|عايز اسمع|سمعني)\s*(.+?)(?:\s*(?:علي|ع)\s*يوتيوب)?$/);
  if(m&&!/^(مؤقت|منبه)/.test(m[1]))return reply('بشغلك '+m[1]+' على يوتيوب','https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]));
  m=t.match(/(?:دور علي|دور على|ابحث عن|ابحث|بحث عن|سيرش)\s*(.+)/);
  if(m)return reply('بدور على '+m[1],'https://www.google.com/search?q='+encodeURIComponent(m[1]));
  m=t.match(/(?:وديني|روح|اتجاهات)\s*(?:ل|الي|إلى)?\s*(.+)/);
  if(m)return reply('بفتحلك الخريطة لـ '+m[1],'https://www.google.com/maps/search/'+encodeURIComponent(m[1]));
  m=t.match(/(?:افتح|فتح|شغل)\s*(.+)/);
  if(m){for(const k in sites){if(m[1].includes(k))return reply('بفتحلك '+k,sites[k])}}
  if(/نكته|نكت|اضحكني/.test(t))return reply(jokes[Math.floor(Math.random()*jokes.length)]);
  if(/(ازيك|عامل ايه|اخبارك)/.test(t))return reply('الحمد لله تمام! أقدر أساعدك في إيه؟');
  if(/(شكرا|تسلم)/.test(t))return reply('العفو! أي خدمة 😊');
  if(/(اسمك|انت مين)/.test(t))return reply('أنا مساعدك الصوتي، اتصمممت عشانك.');
  reply('مفهمتش الأمر ده. جرب تقول: افتح يوتيوب، أو دور على حاجة، أو مؤقت 5 دقايق.');
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false;
if(SR){
  rec=new SR();rec.lang='ar-EG';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{handle(e.results[0][0].transcript)};
  rec.onend=()=>{on=false;$('mic').classList.remove('on')};
  rec.onerror=e=>{on=false;$('mic').classList.remove('on');
    add(e.error==='not-allowed'||e.error==='service-not-allowed'?'⚠️ المايك مش مسموح. اسمح بالمايك من إعدادات المتصفح، أو افتح الصفحة في كروم، أو اكتب الأمر.':'⚠️ مسمعتش كويس، جرب تاني.','bot')};
}
$('mic').onclick=()=>{
  if(!rec){add('⚠️ المتصفح ده مش بيدعم التعرف على الصوت. استخدم كروم، أو اكتب الأمر.','bot');return}
  if(on){rec.stop();return}
  try{speechSynthesis.cancel();rec.start();on=true;$('mic').classList.add('on')}catch(e){}
};
function sendTxt(){const v=$('txt').value;$('txt').value='';handle(v)}
$('send').onclick=sendTxt;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendTxt()});
add('أهلاً! دوس على المايك وقولي أي أمر 🎤','bot');
</script>
</body>
</html>
